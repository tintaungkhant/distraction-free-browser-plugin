<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Distraction-Free Browser</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup" x-data="toggles" x-cloak>
      <h1>Distraction-Free Browser</h1>
      <ul class="sites">
        <li>
          <label>
            <span class="name">YouTube</span>
            <input type="checkbox" x-model="state.youtube" />
          </label>
        </li>
        <li>
          <label>
            <span class="name">Facebook</span>
            <input type="checkbox" x-model="state.facebook" />
          </label>
        </li>
        <li>
          <label>
            <span class="name">TikTok</span>
            <input type="checkbox" x-model="state.tiktok" />
          </label>
        </li>
      </ul>
      <p class="hint">Toggle off to disable blocking on that site.</p>
      <a class="notes-link" href="../notes/notes.html" target="_blank">Open notes</a>
    </main>
    <script src="../dist/popup/popup.js" defer></script>
  </body>
</html>
