<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes (Distraction-Free Browser)</title>
    <link rel="icon" type="image/png" href="../icons/icon-32.png" />
    <link rel="stylesheet" href="notes.css" />
  </head>
  <body>
    <main class="page">
      <header>
        <div class="header-row">
          <h1>Notes</h1>
          <span id="status" class="status"></span>
        </div>
        <p class="hint">
          One scratchpad. Auto-saved locally. Paste or drag images. Click the
          clock to insert a timestamp.
        </p>
      </header>

      <div class="toolbar" id="toolbar">
        <button type="button" data-cmd="bold" title="Bold"><b>B</b></button>
        <button type="button" data-cmd="italic" title="Italic"><i>I</i></button>
        <button type="button" data-cmd="underline" title="Underline"><u>U</u></button>
        <button type="button" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
        <button type="button" data-cmd="insertUnorderedList" title="Bullet list">&bull;</button>
        <button type="button" data-cmd="insertOrderedList" title="Numbered list">1.</button>
        <button type="button" data-cmd="image" title="Insert image">&#128247;</button>
        <button type="button" data-cmd="clock" title="Insert timestamp">&#128340;</button>
      </div>

      <div
        id="editor"
        class="editor"
        contenteditable="true"
        data-placeholder="Write here..."
      ></div>
    </main>
    <script src="../dist/notes/notes.js" defer></script>
  </body>
</html>
